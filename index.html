<!DOCTYPE html>
<html>
<body>
    <h1>Are you gay!</h1>
    <button style="background-color: rgb(39, 223, 39);">Yes</button>
    <button id="noBtn" style="background-color: red; position: absolute; transition: 0.5s; margin-left:10px;" onmouseover="change()" onclick="a()">No</button>
    <script>
        a=()=>{
            alert("You have clicked the buton");
        }
        function change() {
            let x = Math.floor(Math.random() * 500);
            let y = Math.floor(Math.random() * 300);
            let btn = document.getElementById("noBtn");
            btn.style.left = x + "px";
            btn.style.top = y + "px";
        }
    </script>
</body>
</html>
