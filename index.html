<!DOCTYPE html>
<html>
<body>
    <h1>Are you a gay!</h1>
    <button style="background-color: rgb(39, 223, 39);" onclick="a()">Yes</button>
    <button id="noBtn" style="background-color: red; position: absolute; transition: 0.5s; margin-left:10px;"onmouseover="change()" onclick="change()">No</button>
    <script>
        let b = prompt('Enter your name');
        let a=()=>{
                alert(`Noted that ${b} is a gay`);
            }
        function change() {
            let x = Math.floor(Math.random() * 500);
            let y = Math.floor(Math.random() * 300);
            let btn = document.getElementById("noBtn");
            btn.style.left = x + "px";
            btn.style.top = y + "px";
        }
    </script>
</body>
</html>
